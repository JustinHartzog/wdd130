<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trips Page - Alpine Rafting Company</title>
    <meta name="description"
      content="The page for booking a trip with a really cool rafting company if you like going on adventures and having fun">
    <meta name="author" content="Justin Hartzog">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="alpine rafting company logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="contact">
                <button type="submit" class="contact-button"
                  onclick="window.location.href='contact.html'">Contact Us!</button>
            </div>
        </section>

        <section>
            <h2>Trips to Choose From</h2>
            <div class="trips">
                <figure>
                    <img src="images/trip_1.jpg" alt="employee profile picture of James">
                    <figcaption>California</figcaption>
                    <div>Experience 18 miles of fast-paced, continuous Class IV technical rapids
                        through a pristine granite
                        canyon near Yosemite.</div>
                </figure>
                <figure>
                    <img src="images/trip_2.jpg" alt="employee profile picture of susan">
                    <figcaption>Colorado</figcaption>
                    <div>Navigate big, splashy Class III waves while winding through a scenic
                        granite
                        gorge framed by
                        14,000-foot Rocky Mountain peaks.</div>
                </figure>
                <figure>
                    <img src="images/trip_3.jpg" alt="employee profile picture of Abby">
                    <figcaption>Arizona</figcaption>
                    <div>Plunge through legendary, massive whitewater while floating deep between
                        towering ancient rock walls
                        on an iconic desert expedition.</div>
                </figure>
            </div>
        </section>

        <section>
            <div class="available-trips">
                <table>
                    <thead>
                        <tr>
                            <th>Location</th>
                            <th>Trip Guide</th>
                            <th>Date</th>
                            <th>Available Seats</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th rowspan="2">California</th>
                            <th>Kevin</th>
                            <th>Oct. 18th</th>
                            <th>13</th>
                        </tr>
                        <tr>
                            <th>Kate</th>
                            <th>Oct. 23rd</th>
                            <th>10</th>
                        </tr>
                        <tr>
                            <th rowspan="2">Colorado</th>
                            <th>Mike</th>
                            <th>Oct. 20th</th>
                            <th>7</th>
                        </tr>
                        <tr>
                            <th>Brittany</th>
                            <th>Oct. 23rd</th>
                            <th>2</th>
                        </tr>
                        <tr>
                            <th>Arizona</th>
                            <th>Bob</th>
                            <th>Oct. 25th</th>
                            <th>12</th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 | Rafting Company Name | Justin Hartzog</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="20">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin Icon" width="20">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="20">
            </a>
        </nav>
    </footer>
</body>

</html>
